[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tensorboard",
    "scikit-learn",
    "easydict",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "face_rec_fl.server_app:app"
clientapp = "face_rec_fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 100
fraction-train = 0.65
fraction-evaluate = 0.0
local-epochs = 5
learning-rate = 0.1
batch-size = 64
backbone-type = "iresnet18"
max-imgs-per-identity = 9999
lr-decay-interval = 10
resume-from = ""
data-path = "/work/pedro.vidal/dcface_rec/"
run-name = ""


